core_logic:
  causal_edge_threshold: 0.05
  validator_threshold: 0.08
  tabular_validator_threshold: 0.3
  consensus_momentum: 0.7     # m ∈ [0,1]: controls conservatism of graph updates (cited as 0.7 in paper)
  simgnn_epochs: 250
  simgnn_batch_size: 32
  simgnn_lr: 0.001
  simgnn_diversity_prob: 0.8
  coverage_gate_min_queries: 15     # allow 6-sector curriculum (18 tools) to pass
  finance_validator_threshold: 0.07  # tightened from 0.12 → stricter SimGNN rejection
  # --- Dual-Gate PoR (Section 4.4, paper.tex) ---
  ced_threshold: 0.05        # θ: Causal Effect Divergence rejection threshold (auto-calibrates to 95th-percentile of honest CED)
  lambda_s: 0.1              # λ_s: structural compliance coefficient in client PoR regularizer
  lambda_c: 0.05             # λ_c: causal effect compliance coefficient in client PoR regularizer
  ced_ema_alpha: 0.3         # α: EMA blend factor for updating consensus B̄ each round
  grace_period_rounds: 3      # rounds where logic rejections are logged but weights still aggregated (must be < num_rounds)
  adaptive_k_sigma: 3.0       # k-sigma multiplier for adaptive GED threshold (mu + k*sigma)
  correlation_penalty_exponent: 1.5  # exponent for novel-edge correlation penalty; higher = stricter collusion defense
server:
  consensus_episodes: 1000
hardware:
  device: auto
simulation:
  dataset_type: finance
  num_clients: 12
  num_false_nodes: 3
  num_rounds: 15
  local_epochs: 10
  batch_size: 32
  client_lr: 0.0005
  ray_cpus_per_actor: 8
agent_env:
  num_classes: 40
  max_steps: 10
  gamma: 0.99
  epsilon: 0.85
  epoch_batch_scale: 2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
global:
  seed: 42

adversary:
  type: all_three
  trigger_injection_rate: 0.3
