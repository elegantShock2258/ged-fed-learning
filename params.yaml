core_logic:
  causal_edge_threshold: 0.05 # Lowered for binary tabular features (ASIA/ALARM)
  validator_threshold: 0.45
  simgnn_epochs: 500
  simgnn_batch_size: 32
  simgnn_lr: 0.001
  l1_sparsity_penalty: 0.0001 # Very sparse L1 for binary BN data
  notears_lr: 0.02
  notears_max_iter: 200
server:
  consensus_samples: 500
  batch_size: 32
hardware:
  device: auto
simulation:
  num_clients: 30
  num_false_nodes: 5
  num_rounds: 10
  local_epochs: 3
  batch_size: 32
  client_lr: 0.0001
  ray_cpus_per_actor: 4
dataset:
  name: "asia" # Use "asia" (8 nodes) for unit testing, "alarm" (37 nodes) for full scale
  total_samples: 10000
  seed: 42
vastai:
  instance_id: "32888853"
