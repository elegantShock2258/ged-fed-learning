version: '3.8'

services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Persist generated models and simulation results between runs
      - ./saved_models:/app/saved_models
      # Mount params.yaml so you can change config without rebuilding
      - ./params.yaml:/app/params.yaml
    stdin_open: true
    tty: true
    # GPU support (optional - requires nvidia-container-toolkit on host)
    # Uncomment the deploy block below to enable GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
