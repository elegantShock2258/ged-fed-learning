# ============================================================
# Causal Proof of Reasoning — Federated Learning Dashboard
#
# Quick start (first-time user):
#   git clone https://github.com/elegantShock2258/ged-fed-learning
#   cd ged-fed-learning
#   docker compose up --build
#   → Open http://localhost:8501
#
# Run FL simulation (generates saved_models/):
#   docker compose run --rm sim
#
# Run baseline simulation:
#   docker compose run --rm baseline
#
# Generate evaluation graphs (after simulation):
#   docker compose run --rm graphs
#
# Stop everything:
#   docker compose down
# ============================================================

services:
  # ── Streamlit dashboard (default service) ──────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # CPU wheel (default). For CUDA 12.6 uncomment below and rebuild:
        # TORCH_INSTALL_URL: https://download.pytorch.org/whl/cu126
        TORCH_INSTALL_URL: https://download.pytorch.org/whl/cpu
    image: causal-por:latest
    container_name: causal-por-app
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      # Persist simulation results between container restarts
      - ./saved_models:/app/saved_models
      # Persist generated evaluation graphs
      - ./graphs:/app/graphs
      # Hot-reload config: edit params.yaml on host without rebuilding
      - ./params.yaml:/app/params.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  # ── PoR FL simulation (run once to generate models + logs) ─
  sim:
    image: causal-por:latest
    container_name: causal-por-sim
    command: python federated_sim.py
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./saved_models:/app/saved_models
      - ./params.yaml:/app/params.yaml:ro
    profiles:
      - tools   # only starts with: docker compose --profile tools run sim

  # ── Baseline FedAvg simulation ─────────────────────────────
  baseline:
    image: causal-por:latest
    container_name: causal-por-baseline
    command: python baseline_fedavg_sim.py
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./saved_models:/app/saved_models
      - ./params.yaml:/app/params.yaml:ro
    profiles:
      - tools

  # ── Evaluation graph generation ────────────────────────────
  graphs:
    image: causal-por:latest
    container_name: causal-por-graphs
    command: python graphs/run_all.py
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - MPLBACKEND=Agg    # headless matplotlib (no display needed)
    volumes:
      - ./saved_models:/app/saved_models
      - ./graphs:/app/graphs
    profiles:
      - tools

  # ── MTA + ASR evaluation ───────────────────────────────────
  eval:
    image: causal-por:latest
    container_name: causal-por-eval
    command: python graphs/eval_asr_mta.py
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./saved_models:/app/saved_models
    profiles:
      - tools

    # ----------------------------------------------------------
    # GPU SUPPORT (optional)
    # Requires: nvidia-container-toolkit on the host
    # Guide: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
    #
    # 1. Change TORCH_INSTALL_URL in the app service above to:
    #      TORCH_INSTALL_URL: https://download.pytorch.org/whl/cu126
    # 2. docker compose build
    # 3. Uncomment the deploy block below on ALL services:
    # ----------------------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
