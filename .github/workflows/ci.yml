name: CI Pipeline

on:
  push:
    branches: ["main", "master", "dev", "feature/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install PyTorch (CPU-only for CI)
        run: |
          uv pip install torch==2.4.0 torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyG
        run: |
          uv pip install torch-geometric torch-scatter torch-sparse \
            -f https://data.pyg.org/whl/torch-2.4.0+cpu.html

      - name: Install project dependencies
        run: uv pip install -r requirements.txt

      - name: Install pytest
        run: uv pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          uv run python -m pytest tests/unit/ -v \
            --tb=short \
            --cov=client --cov=server --cov=adversary \
            --cov-report=term-missing \
            --cov-fail-under=40

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install ruff
      - name: Check style
        run: uv run ruff check client/ server/ adversary/ --select E,W,F --ignore E501,E402,F401
