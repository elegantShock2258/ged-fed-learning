name: E2E Docker Integration Test

on:
  push:
    branches:
      - main
      - fed-neat-evolution
  pull_request:
    branches:
      - main
      - fed-neat-evolution

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # PyTorch CPU wheel + ML deps + simulation runtime

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Execute E2E bash script Let's Run
        run: |
          chmod +x ./tests/e2e_docker_test.sh
          ./tests/e2e_docker_test.sh
